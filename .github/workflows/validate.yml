name: Validate AI OS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated skill registry
        run: python scripts/generate-skill-registry.py --check
      - name: Check generated repository index
        run: python scripts/index-repository.py --check
      - name: Run unified validation
        run: python scripts/validate-all.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
